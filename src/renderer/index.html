<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roseflow PC Mac Training</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="identity">
    <div class="identity-name">
      <strong>Roseflow PC Mac Training</strong>
      <span>Independent training app, simulation only. Nothing here connects to a controller or sends a command.</span>
    </div>
    <nav class="topnav" aria-label="App sections" id="topnav">
      <button type="button" id="nav-home" data-control="nav-home">Home</button>
      <button type="button" id="handbook-toggle" data-control="handbook-toggle" aria-pressed="false">Handbook</button>
      <button type="button" id="nav-progress" data-control="nav-progress">Progress</button>
      <button type="button" id="help-current" data-control="help-button" aria-pressed="false" title="Then click any control to explain it (F1 explains the focused control)">Help ?</button>
    </nav>
  </header>

  <div id="persistence-notice" class="notice" role="status" aria-live="polite" hidden></div>

  <main class="shell" id="shell">
    <section id="stage" class="stage" aria-label="Start"></section>
    <aside id="panel" class="panel" aria-label="Lesson panel" hidden></aside>
    <section id="desk" class="desk" aria-label="Recreated PC•MACs windows and the simulated float" hidden>
      <div id="pcmacs" class="pcmacs"></div>
      <div id="float"></div>
    </section>
    <aside id="handbook" class="handbook" aria-label="Handbook" hidden></aside>
  </main>

  <div id="tooltip" role="tooltip" hidden></div>
  <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
  <dialog id="photo-dialog" aria-label="Reference photo"></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <dialog id="control-dialog" aria-labelledby="control-title"></dialog>
  <dialog id="value-dialog" class="w8-dialog" aria-labelledby="value-title"></dialog>
</body>
</html>
